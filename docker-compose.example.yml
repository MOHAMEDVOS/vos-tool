version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - FRONTEND_URL=${FRONTEND_URL:-http://webapp:3000}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - DB_TYPE=postgresql
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-vos_tool}
      - POSTGRES_USER=${POSTGRES_USER:-vos_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - UPLOAD_DIR=/app/Recordings
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY:-}
      - READYMODE_USER=${READYMODE_USER:-}
      - READYMODE_PASSWORD=${READYMODE_PASSWORD:-}
    volumes:
      - recordings_data:/app/Recordings
      - dashboard_data:/app/dashboard_data
      - chrome_sessions:/app/chrome_profile_sessions
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    networks:
      - vos-network

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    ports:
      - "${WEBAPP_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - vos-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - vos-network
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  recordings_data:
  dashboard_data:
  chrome_sessions:
  redis_data:

networks:
  vos-network:
    driver: bridge
