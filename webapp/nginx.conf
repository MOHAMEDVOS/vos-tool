server {
    listen 8080;
    server_name _;

    # Railway internal DNS
    resolver 8.8.8.8 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Variable-based upstream prevents nginx crash if backend is not yet up.
        # Railway private networking: vos-tool.railway.internal on port 8080.
        set $backend_upstream "vos-tool.railway.internal:8080";
        proxy_pass http://$backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /health {
        set $backend_upstream "vos-tool.railway.internal:8080";
        proxy_pass http://$backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
