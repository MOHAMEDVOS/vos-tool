server {
    listen 8080;
    server_name _;

    resolver 1.1.1.1 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://vos-tool-production.up.railway.app/api/;
        proxy_http_version 1.1;
        proxy_set_header Host vos-tool-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /health {
        proxy_pass https://vos-tool-production.up.railway.app/health;
        proxy_http_version 1.1;
        proxy_set_header Host vos-tool-production.up.railway.app;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
